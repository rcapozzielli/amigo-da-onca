<body>
  <main>
    <section class="hero">
      <span class="emoji-grande" aria-hidden="true">📣</span>
      <h1>Mural</h1>
      <p>Recado, ameaça, provocação. Todo mundo vê, com seu nome.</p>
      <p class="en" lang="en">Public wall. Everyone sees your name.</p>
    </section>

    <section class="cartao">
      <form id="form-mural" novalidate>
        <label for="mural-nome">Quem é você?</label>
        <select id="mural-nome" required></select>
        <label for="mural-senha">Sua senha (a da inscrição)</label>
        <input id="mural-senha" type="password" autocomplete="current-password" required>
        <label for="mural-texto">Mensagem</label>
        <textarea id="mural-texto" maxlength="280" required placeholder="Ex.: já comprei seu presente e ele é molhado"></textarea>
        <p class="oculto" id="mural-aviso" role="status"></p>
        <p style="text-align:center;margin:16px 0 0">
          <button class="botao" id="mural-enviar" type="submit">Postar</button>
        </p>
      </form>
    </section>

    <section class="cartao">
      <h2>🗞️ Últimas</h2>
      <div id="lista-mural">Aguardando mensagem. Essa ação pode levar alguns instantes.</div>
    </section>
  </main>
